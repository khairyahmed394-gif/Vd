<!doctype html><html><head><meta charset="utf-8"><title>ClinStat – 5 Questions</title>
<style>
@font-face{font-family:LX;src:url(Lexend.ttf);font-weight:100 900}
html,body{margin:0;padding:0;background:#F9F5EF;width:1080px;height:1920px;overflow:hidden}
svg{display:block} text{font-family:LX,sans-serif}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const LG=__LOGO__;
const W=1080,H=1920,NS="http://www.w3.org/2000/svg",TOTAL=20.0;
// colours sampled from the supplied logo / infographic pixels
const C={ivory:"#F9F5EF",ink:"#003520",forest:"#025130",gold:"#B19063",tan:"#D4BD9E"};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,x)=>a+(b-a)*x,P=(t,a,b)=>clamp((t-a)/(b-a));
const E={out:x=>1-Math.pow(1-x,3),io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
function el(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e;}
const EVENTS=[];const ev=(t,k,v=1,n=0)=>EVENTS.push({t,k,v,n});window.EVENTS=EVENTS;
const svg=document.getElementById("s"),defs=el("defs",{},svg);
function text(par,str,x,y,size,weight,fill,extra={}){const t=el("text",Object.assign({x,y,"font-size":size,"font-weight":weight,fill},extra),par);t.textContent=str;return t;}
function fitMax(t,max){const w=t.getBBox().width;if(w>max)t.setAttribute("font-size",parseFloat(t.getAttribute("font-size"))*max/w);return t;}
function setIn(g,p,dy=14,dx=0){const e=E.out(clamp(p));g.setAttribute("opacity",clamp(p).toFixed(3));g.setAttribute("transform",`translate(${((1-e)*dx).toFixed(2)},${((1-e)*dy).toFixed(2)})`);}
function pl(s){s.setAttribute("pathLength","1");s.setAttribute("stroke-dasharray","1");s.setAttribute("stroke-dashoffset","1");return s;}
function draw(s,p){s.setAttribute("stroke-dashoffset",(1-clamp(p)).toFixed(4));}
const sh=el("filter",{id:"sh",x:"-30%",y:"-30%",width:"160%",height:"170%"},defs);el("feDropShadow",{dx:0,dy:6,stdDeviation:7,"flood-color":"#00200f","flood-opacity":.16},sh);
const R={};
// ---------------------------------------------------------------- the official logo (traced 1:1 from the supplied file)
function lockup(parent){const g=el("g",{},parent),inner=el("g",{},g);
 LG.dots.forEach(d=>el("circle",{cx:d.cx,cy:d.cy,r:d.r,fill:d.color},inner));LG.chev.forEach(c=>el("path",{d:c.d,fill:c.color,"fill-rule":"evenodd"},inner));
 el("path",{d:LG.divider.d,fill:LG.divider.color},inner);["clin","stat","res"].forEach(k=>LG[k].forEach(l=>el("path",{d:l.d,fill:l.color,"fill-rule":"evenodd"},inner)));return g;}
const LCX=(LG.mark.x0+LG.word.x1)/2,LCY=(LG.mark.y0+LG.mark.y1)/2;
function place(g,cx,cy,k){g.firstChild.setAttribute("transform",`translate(${cx},${cy}) scale(${k}) translate(${-LCX},${-LCY})`);}
function build(){
 el("rect",{width:W,height:H,fill:C.ivory},svg);
 R.comp=el("g",{},svg);                      // infographic content (fades out for the closing logo)
 // logo (top)
 R.logo=lockup(svg);
 // headline: dark bar + gold badge with the 5, then the headline
 R.hd=el("g",{},R.comp);
 R.bar=el("rect",{x:0,y:500,width:36,height:124,fill:C.ink},R.hd);
 R.badge=el("g",{},R.hd);el("rect",{x:36,y:500,width:116,height:124,fill:C.gold,filter:"url(#sh)"},R.badge);text(R.badge,"5",94,590,100,700,C.ink,{"text-anchor":"middle"});
 R.h1=el("g",{},R.hd);fitMax(text(R.h1,"questions to ask before you bring",176,548,47,700,C.ink),826);
 R.h2=el("g",{},R.hd);fitMax(text(R.h2,"a biostatistician onto your project:",176,606,47,700,C.ink),826);
 // five questions
 const Q=[["Do they ask about your research question","before your data?"],["Can they explain the method in plain language,","not just jargon?"],["Do they review your study design, or only","analyse what's already collected?"],["Do they document every step so someone else","could reproduce it?"],["What does their own publication","record look like?"]];
 R.q=Q.map((ls,i)=>{const y0=742+i*142,g=el("g",{},R.comp);const c=el("g",{transform:`translate(114,${y0+28})`},g);const disc=el("g",{},c);el("circle",{r:31,fill:C.gold,filter:"url(#sh)"},disc);
  const num=el("g",{},c);text(num,String(i+1),0,12,34,700,C.ink,{"text-anchor":"middle"});
  const lines=ls.map((s,k)=>{const lg=el("g",{},g);const t=text(lg,s,176,y0+38+k*52,37,350,C.ink);fitMax(t,838);return lg;});
  return{g,disc,num,lines,y0};});
 // credibility statement (team icon + text)
 R.st=el("g",{},R.comp);const ig=el("g",{transform:"translate(126,1500)"},R.st),sw={fill:"none",stroke:C.gold,"stroke-width":4,"stroke-linecap":"round","stroke-linejoin":"round"};
 R.icon=[["circle",{cx:0,cy:-26,r:19}],["path",{d:"M-34,34 Q-34,4 0,4 Q34,4 34,34"}],["circle",{cx:-52,cy:-10,r:14}],["path",{d:"M-84,34 Q-84,12 -52,12"}],["circle",{cx:52,cy:-10,r:14}],["path",{d:"M84,34 Q84,12 52,12"}]].map(([tag,at])=>pl(el(tag,Object.assign({},sw,at),ig)));
 R.s1=el("g",{},R.st);text(R.s1,"Ours: every team member has",232,1498,42,350,C.ink);
 R.s2=el("g",{},R.st);{const t=el("text",{x:232,y:1553,"font-size":42,"font-weight":350,fill:C.ink},R.s2);
  [["50+ papers",1],[" and an ",0],["h-index of 5+",1],[".",0]].forEach(([s,b])=>{const ts=el("tspan",b?{"font-weight":600}:{},t);ts.textContent=s;});R.s2t=t;}
 R.u1=pl(el("line",{x1:232,x2:232,y1:1568,y2:1568,stroke:C.gold,"stroke-width":3.5,"stroke-linecap":"round"},R.st));R.u2=pl(el("line",{x1:232,x2:232,y1:1568,y2:1568,stroke:C.gold,"stroke-width":3.5,"stroke-linecap":"round"},R.st));
 const sub=(a,b)=>{const t=R.s2t;const n0=t.getStartPositionOfChar(a),n1=t.getEndPositionOfChar(b);return[n0.x,n1.x];};
 const full=R.s2t.textContent; const i1=full.indexOf("50+ papers"),i2=full.indexOf("h-index of 5+");
 const u1=sub(i1,i1+9),u2=sub(i2,i2+12);R.u1.setAttribute("x1",u1[0]);R.u1.setAttribute("x2",u1[1]);R.u2.setAttribute("x1",u2[0]);R.u2.setAttribute("x2",u2[1]);
 // curved forest-green and gold footer (as in the infographic)
 R.foot=el("g",{},svg);
 el("path",{d:"M360,1920 C730,1919 950,1872 1080,1778 L1080,1920 Z",fill:C.gold},R.foot);
 el("path",{d:"M360,1920 C730,1919 950,1872 1080,1778 L1080,1750 C960,1840 760,1896 470,1920 Z",fill:C.forest},R.foot);
}
// ---------------------------------------------------------------- schedule (brief): 0-3 opening | 3-6 Q1 | 6-9 Q2 | 9-12 Q3 | 12-16 Q4,Q5 | 16-20 statement + logo
const T={logo:.2,bar:.9,badge:1.05,h1:1.45,h2:1.75,foot:.5,
 q:[{c:3.1,n:3.35,l:[3.6]},{c:6.1,n:6.35,l:[6.6]},{c:9.1,n:9.35,l:[9.6,10.4]},{c:12.1,n:12.35,l:[12.6]},{c:14.1,n:14.35,l:[14.6]}],
 icon:16.0,s1:16.45,s2:16.9,u1:17.35,u2:17.65,fadeOut:18.2,move:18.3};
ev(.28,"chime",.6,0);ev(.4,"swell",.35);ev(1.05,"soft",.5);ev(1.45,"tick",.5);ev(1.75,"tick",.5);ev(.5,"swell",.25);ev(2.9,"swell",.3);
T.q.forEach((q,i)=>{ev(q.c,"confirm",.7);ev(q.c+.12,"chime",.5,[0,1,2,3,4][i]);q.l.forEach(l=>ev(l,"tick",.5));});
ev(5.9,"swell",.25);ev(8.9,"swell",.25);ev(11.9,"swell",.25);ev(T.icon,"draw",.35);ev(T.s1,"tick",.5);ev(T.s2,"tick",.5);ev(T.u1,"chime",.6,3);ev(T.u2,"chime",.6,4);ev(16.0-.2,"swell",.3);
ev(18.2,"swell",.5);ev(18.85,"chime",.8,5);ev(19.0,"chime",.7,2);
function render(t){if(!window.READY)return;
 // logo: opacity fade + slight upward movement, then glides to the centre for the closing hold
 const li=E.out(P(t,T.logo,T.logo+.9)),mv=E.io(P(t,T.move,T.move+1.0));
 const k=lerp(.73,1.3,mv),cx=540,cy=lerp(318,860,mv)+(1-li)*18;place(R.logo,cx,cy,k);R.logo.setAttribute("opacity",li.toFixed(3));
 R.comp.setAttribute("opacity",(1-E.io(P(t,T.fadeOut,T.fadeOut+.7))).toFixed(3));
 // footer present from the start, gentle rise
 R.foot.setAttribute("opacity",E.out(P(t,T.foot,T.foot+.9)).toFixed(3));R.foot.setAttribute("transform",`translate(0,${((1-E.out(P(t,T.foot,T.foot+1.0)))*40).toFixed(1)})`);
 // headline: dark bar slides in, gold badge scales in, headline lines rise
 R.bar.setAttribute("transform",`translate(${(-(1-E.out(P(t,T.bar,T.bar+.5)))*40).toFixed(1)},0)`);
 {const p=E.out(P(t,T.badge,T.badge+.5)),s=.82+.18*p;R.badge.setAttribute("opacity",P(t,T.badge,T.badge+.3).toFixed(3));R.badge.setAttribute("transform",`translate(36,562) scale(${s}) translate(-36,-562)`);}
 setIn(R.h1,P(t,T.h1,T.h1+.6),14);setIn(R.h2,P(t,T.h2,T.h2+.6),14);
 // questions
 R.q.forEach((q,i)=>{const d=T.q[i],p=E.out(P(t,d.c,d.c+.4)),np=E.out(P(t,d.n,d.n+.35));
  q.disc.setAttribute("opacity",p.toFixed(3));q.disc.setAttribute("transform",`scale(${(.6+.4*p).toFixed(3)})`);q.num.setAttribute("opacity",np.toFixed(3));q.num.setAttribute("transform",`translate(0,${((1-np)*12).toFixed(2)})`);
  q.lines.forEach((l,k)=>{const s=d.l[Math.min(k,d.l.length-1)]+(d.l.length==1?k*.18:0);setIn(l,P(t,s,s+.55),i==1?0:12,i==1?-34:0);});});
 // statement
 R.icon.forEach((s,j)=>draw(s,E.io(P(t,T.icon+j*.07,T.icon+.7+j*.07))));setIn(R.s1,P(t,T.s1,T.s1+.55),12);setIn(R.s2,P(t,T.s2,T.s2+.55),12);
 draw(R.u1,E.io(P(t,T.u1,T.u1+.5)));draw(R.u2,E.io(P(t,T.u2,T.u2+.5)));
}
window.render=render;window.TOTAL=TOTAL;
Promise.all(["700 100px LX","350 100px LX","600 100px LX"].map(f=>document.fonts.load(f))).then(()=>document.fonts.ready).then(()=>{build();place(R.logo,540,318,.73);window.READY=true;render(0);});
</script></body></html>
